---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frat-voice
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: frat-voice
  template:
    metadata:
      labels:
        component: frat-voice
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/gastbob40/frat-voice:latest
          imagePullPolicy: Always
          env:
            - name: POD_METADATA_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: DB_HOST
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: frat_voice
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: fraternity.frat-voice.infra-main-cluster.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraternity.frat-voice.infra-main-cluster.credentials.postgresql.acid.zalan.do
                  key: password
            - name: BOT_OWNER_ID
              value: "309653542354944000"
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: frat-voice-secrets
                  key: BOT_TOKEN
