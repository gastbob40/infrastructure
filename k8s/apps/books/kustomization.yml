---
kind: Kustomization
namespace: books

labels:
  - pairs:
      component: books
    includeSelectors: false
    includeTemplates: false

resources:
  - namespace.yml
  - pvc.yml
  - deployment.yml
  - ingress.yml
  - service.yml
  - backup.yml

configMapGenerator:
  - name: books-backup-scripts
    files:
      - backup/snapshot.py
      - backup/verify.py
      - backup/upload.sh
