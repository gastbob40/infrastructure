---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "cocfc-clash-moderation"
  namespace: "cocfr"
  annotations:
    cert-manager.io/cluster-issuer: default-issuer
    cert-manager.io/revision-history-limit: "1"

spec:
  ingressClassName: public
  rules:
    - host: "cocfr.gastbob40.com"
      http:
        # The moderation panel owns the host: it serves its own pages, the Vaadin engine on /, the OIDC callback
        # and the public legal documents, so nothing may be rewritten or stripped from the path
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "cocfc-clash-moderation"
                port:
                  number: 8080
  tls:
    - hosts:
        - "cocfr.gastbob40.com"
      secretName: "cocfr.gastbob40.com-tls"