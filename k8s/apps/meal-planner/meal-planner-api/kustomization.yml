---
kind: Kustomization

commonLabels:
  component: meal-planner-api

configMapGenerator:
  - name: chronodrive-client-config
    files:
      - application.properties=chronodrive.properties
  - name: common-config
    literals:
      - DB_HOST=infra-main-cluster.postgres.svc.cluster.local

resources:
  - deployment.yml
  - secrets.yml
  - service.yml
  - ingress.yml

