# Validation temporaire du chemin HTTP-01 natif, sans remplacer les certificats servis.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: traefik-acme-validation
  namespace: argocd
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: gastbob40@gmail.com
    privateKeySecretRef:
      name: traefik-acme-validation-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-acme-validation
  namespace: argocd
spec:
  secretName: traefik-acme-validation-certificate
  dnsNames:
    - argocd.k8s.gastbob40.com
  issuerRef:
    name: traefik-acme-validation
    kind: Issuer
