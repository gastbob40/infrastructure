# Argo CD recharge automatiquement ce certificat pour son endpoint HTTPS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-tls
  namespace: argocd
spec:
  secretName: argocd-server-tls
  dnsNames:
    - argocd.k8s.gastbob40.com
  issuerRef:
    name: default-issuer
    kind: ClusterIssuer
