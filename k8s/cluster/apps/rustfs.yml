apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
spec:
  project: default
  destination:
    name: in-cluster
    namespace: rustfs
  source:
    repoURL: https://charts.rustfs.com
    chart: rustfs
    targetRevision: 1.0.4
    helm:
      skipTests: true
      values: |
        fullnameOverride: rustfs
        replicaCount: 1
        mode:
          standalone:
            enabled: true
            strategy:
              type: Recreate
          distributed:
            enabled: false

        image:
          rustfs:
            repository: rustfs/rustfs
            tag: "1.0.4"
          initImage:
            repository: busybox
            tag: "1.37.0"

        # Les clients gardent leurs identifiants pendant la migration.
        # Le Secret est créé par Vault Secrets Operator, jamais par Helm.
        secret:
          existingSecret: rustfs-credentials
        extraEnv:
          # Meal Planner envoie ses images depuis le navigateur via des URL
          # présignées PUT. MinIO autorisait cette origine globalement.
          - name: RUSTFS_CORS_ALLOWED_ORIGINS
            value: https://meal-planner.gastbob40.com
          - name: RUSTFS_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-credentials
                key: rootUser
          - name: RUSTFS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-credentials
                key: rootPassword
        extraManifests:
          - apiVersion: ricoberger.de/v1alpha1
            kind: VaultSecret
            metadata:
              name: rustfs-credentials
              namespace: rustfs
            spec:
              path: k8s/minio
              keys:
                - rootUser
                - rootPassword
              type: Opaque

        config:
          rustfs:
            region: us-east-1
            obs_environment: production
            # Logs sur stdout ; pas de second PVC pour les logs.
            obs_log_directory: ""

        serviceAccount:
          automount: false
        service:
          type: ClusterIP
        extraVolumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
        extraVolumeMounts:
          - name: tmp
            mountPath: /tmp

        storageclass:
          name: local-path
          dataStorageSize: 50Gi
          pvcAnnotations:
            data:
              argocd.argoproj.io/sync-options: Prune=false,Delete=false

        nodeSelector:
          kubernetes.io/hostname: k8s-master
        tolerations:
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          initialDelaySeconds: 60
          timeoutSeconds: 5
          failureThreshold: 6

        # Phase 1 : accès uniquement par port-forward. Aucun changement DNS.
        # Activer via Git/ArgoCD seulement après vérification des nouveaux DNS.
        ingress:
          enabled: false
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: default-issuer
            cert-manager.io/revision-history-limit: "1"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: api.s3-next.gastbob40.com
              paths:
                - path: /
                  pathType: Prefix
                  servicePort: endpoint
            - host: s3-next.gastbob40.com
              paths:
                - path: /
                  pathType: Prefix
                  servicePort: console
          tls:
            enabled: true
            certManager:
              enabled: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 2
