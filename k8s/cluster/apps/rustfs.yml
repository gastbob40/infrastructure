apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
spec:
  project: default
  destination:
    name: in-cluster
    namespace: rustfs
  source:
    repoURL: https://charts.rustfs.com
    chart: rustfs
    targetRevision: 1.0.4
    helm:
      skipTests: true
      values: |
        fullnameOverride: rustfs
        replicaCount: 1
        mode:
          standalone:
            enabled: true
            strategy:
              type: Recreate
          distributed:
            enabled: false

        image:
          rustfs:
            repository: rustfs/rustfs
            tag: "1.0.4"
          initImage:
            repository: busybox
            tag: "1.37.0"

        # Les clients gardent leurs identifiants pendant la migration.
        # Le Secret est créé par Vault Secrets Operator, jamais par Helm.
        secret:
          existingSecret: rustfs-credentials
        extraEnv:
          # Le CORS des buckets est configuré par le hook PostSync ci-dessous.
          # La variable globale ne reconnaît pas https://*.gastbob40.com.
          - name: RUSTFS_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-credentials
                key: rootUser
          - name: RUSTFS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: rustfs-credentials
                key: rootPassword
        extraManifests:
          - apiVersion: ricoberger.de/v1alpha1
            kind: VaultSecret
            metadata:
              name: rustfs-credentials
              namespace: rustfs
            spec:
              path: k8s/minio
              keys:
                - rootUser
                - rootPassword
              type: Opaque
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: rustfs-bucket-cors
            data:
              cors.json: |
                {
                  "CORSRules": [{
                    "AllowedOrigins": ["https://*.gastbob40.com"],
                    "AllowedMethods": ["GET", "HEAD", "PUT", "POST", "DELETE"],
                    "AllowedHeaders": ["*"],
                    "ExposeHeaders": ["ETag"],
                    "MaxAgeSeconds": 3600
                  }]
                }
          # Rejoué à chaque synchronisation complète, après disponibilité de
          # RustFS et du Secret. Ne modifie que la configuration des buckets.
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: rustfs-bucket-cors
              annotations:
                argocd.argoproj.io/hook: PostSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
            spec:
              backoffLimit: 2
              activeDeadlineSeconds: 300
              template:
                spec:
                  restartPolicy: Never
                  automountServiceAccountToken: false
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    runAsGroup: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: configure-cors
                      image: public.ecr.aws/aws-cli/aws-cli:2.38.5
                      command: [/bin/sh, -ec]
                      args:
                        - |
                          for bucket in meal-planner postgres-backups; do
                            if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
                              aws s3api create-bucket --bucket "$bucket"
                            fi
                            aws s3api put-bucket-cors --bucket "$bucket" \
                              --cors-configuration file:///config/cors.json
                            echo "CORS configuré : $bucket"
                          done
                      env:
                        - name: AWS_ENDPOINT_URL
                          value: http://rustfs-svc:9000
                        - name: AWS_DEFAULT_REGION
                          value: us-east-1
                        - name: AWS_EC2_METADATA_DISABLED
                          value: "true"
                        - name: AWS_PAGER
                          value: ""
                        - name: AWS_ACCESS_KEY_ID
                          valueFrom:
                            secretKeyRef:
                              name: rustfs-credentials
                              key: rootUser
                        - name: AWS_SECRET_ACCESS_KEY
                          valueFrom:
                            secretKeyRef:
                              name: rustfs-credentials
                              key: rootPassword
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: [ALL]
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          cpu: 500m
                          memory: 256Mi
                      volumeMounts:
                        - name: cors
                          mountPath: /config
                          readOnly: true
                        - name: tmp
                          mountPath: /tmp
                  volumes:
                    - name: cors
                      configMap:
                        name: rustfs-bucket-cors
                    - name: tmp
                      emptyDir:
                        sizeLimit: 16Mi

        config:
          rustfs:
            region: us-east-1
            obs_environment: production
            # Logs sur stdout ; pas de second PVC pour les logs.
            obs_log_directory: ""

        serviceAccount:
          automount: false
        service:
          type: ClusterIP
        extraVolumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
        extraVolumeMounts:
          - name: tmp
            mountPath: /tmp

        storageclass:
          name: local-path
          dataStorageSize: 50Gi
          pvcAnnotations:
            data:
              argocd.argoproj.io/sync-options: Prune=false,Delete=false

        nodeSelector:
          kubernetes.io/hostname: k8s-master
        tolerations:
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          initialDelaySeconds: 60
          timeoutSeconds: 5
          failureThreshold: 6

        # Phase 1 : accès uniquement par port-forward. Aucun changement DNS.
        # Activer via Git/ArgoCD seulement après vérification des nouveaux DNS.
        ingress:
          enabled: false
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: default-issuer
            cert-manager.io/revision-history-limit: "1"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: api.s3-next.gastbob40.com
              paths:
                - path: /
                  pathType: Prefix
                  servicePort: endpoint
            - host: s3-next.gastbob40.com
              paths:
                - path: /
                  pathType: Prefix
                  servicePort: console
          tls:
            enabled: true
            certManager:
              enabled: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 2
