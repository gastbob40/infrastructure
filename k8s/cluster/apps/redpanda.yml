apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.redpanda.com
    targetRevision: 26.2.3
    chart: redpanda
    helm:
      values: |
        statefulset:
          replicas: 1
        podTemplate:
          spec:
            nodeSelector:
              node-role.kubernetes.io/master: "true"
        listeners:
          kafka:
            tls:
              enabled: false
        console:
          enabled: true

  destination:
    namespace: redpanda
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true

---


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redpanda-console-ingress
  namespace: redpanda
  annotations:
    cert-manager.io/cluster-issuer: default-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: oauth-errors@file,oauth-auth@file
    cert-manager.io/revision-history-limit: "1"

spec:
  ingressClassName: traefik
  rules:
    - host: "kafka-console.k8s.gastbob40.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "redpanda-console"
                port:
                  number: 8080
  tls:
    - hosts:
        - "kafka-console.k8s.gastbob40.com"
      secretName: "redpanda-console-tls"
