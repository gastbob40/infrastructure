apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-deployment
  namespace: argocd
  annotations:
    # Use the cluster's schema for SSA diffs, including during the 2.x upgrade.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    path: k8s/cluster/argocd-deployment
    repoURL: https://github.com/gastbob40/infrastructure.git
    
  destination:
    namespace: argocd-deployment
    name: in-cluster
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Argo CD's ApplicationSet CRD exceeds the client-side apply annotation limit.
      - ServerSideApply=true
