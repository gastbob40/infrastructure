# Contrôleur d'entrée public, géré par Argo CD indépendamment de K3s.
# La compatibilité NGINX conserve temporairement les routes existantes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  destination:
    namespace: traefik
    name: in-cluster
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      skipCrds: true
      values: |
        deployment:
          replicas: 2
          revisionHistoryLimit: 2
          # Les limites d'upload existantes vont jusqu'à 4 GiB.
          # emptyDir utilise le disque du nœud, pas la mémoire ni un PVC.
          tmpVolume:
            emptyDir:
              sizeLimit: 8Gi

        nodeSelector:
          kubernetes.io/hostname: k8s-master
        tolerations:
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule

        # Les classes public (transition) et traefik sont gérées par cluster-misc.
        ingressClass:
          enabled: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
            publishedService:
              enabled: true
          kubernetesGateway:
            enabled: false
          kubernetesIngressNGINX:
            enabled: true
            controllerClass: k8s.io/ingress-nginx
            ingressClass: public
            ingressClassByName: false
            watchIngressWithoutClass: false
            # Publier les adresses du ServiceLB Traefik après la bascule.
            publishService:
              enabled: true
            publishStatusAddress: ""
            # Nécessaire pour faire respecter proxy-body-size, comme NGINX.
            proxyRequestBuffering: true
          file:
            enabled: true
            watch: true
            content:
              http:
                middlewares:
                  public-hsts:
                    headers:
                      stsSeconds: 31536000
                      stsIncludeSubdomains: true
                      stsPreload: false
                      forceSTSHeader: false
                  # L'ordre sur les routes protégées doit être oauth-errors, oauth-auth.
                  oauth-errors:
                    errors:
                      status:
                        - "401"
                      statusRewrites:
                        "401": 302
                      service: oauth-proxy@file
                      query: "/oauth2/start?rd={url}"
                  oauth-auth:
                    forwardAuth:
                      address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
                      trustForwardHeader: true
                      authResponseHeaders:
                        - X-Auth-Request-User
                        - X-Auth-Request-Email
                      maxResponseBodySize: 1048576
                services:
                  oauth-proxy:
                    loadBalancer:
                      servers:
                        - url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180
                serversTransports:
                  vault-tls:
                    serverName: vault.k8s.gastbob40.com
                  # Argo CD présente un certificat interne auto-signé.
                  # Cette exception reste limitée au Service Argo CD, jusqu'à
                  # l'émission du Certificate argocd-server-tls par cert-manager.
                  argocd-tls:
                    insecureSkipVerify: true

        # Depuis le chart 40, le type du Service se configure sous spec.
        service:
          spec:
            type: LoadBalancer
        # Le défaut Traefik (60 s pour lire tout le corps) écourterait les gros uploads.
        # 3600 s est un plafond total, distinct des timeouts d'inactivité des backends.
        ports:
          web:
            http:
              # Comme NGINX, ignorer les variantes de noms avec underscore ou point.
              aliasHeadersStrategy: delete
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  # Les routes HTTP-01 de cert-manager restent prioritaires.
                  priority: 1
            transport:
              respondingTimeouts:
                readTimeout: 3600s
                writeTimeout: 0s
          websecure:
            http:
              aliasHeadersStrategy: delete
              tls:
                enabled: true
              # Préserver le HSTS que NGINX ajoutait aux réponses HTTPS.
              middlewares:
                - public-hsts@file
            transport:
              respondingTimeouts:
                readTimeout: 3600s
                writeTimeout: 0s
        api:
          dashboard: false
        ingressRoute:
          dashboard:
            enabled: false
        log:
          format: json
          level: INFO
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 512Mi
            ephemeral-storage: 10Gi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 2
