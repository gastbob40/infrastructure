# Contrôleur d'entrée public, géré par Argo CD indépendamment de K3s.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  destination:
    namespace: traefik
    name: in-cluster
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      skipCrds: true
      values: |
        deployment:
          replicas: 2
          revisionHistoryLimit: 2

        nodeSelector:
          kubernetes.io/hostname: k8s-master
        tolerations:
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule

        # La classe traefik est gérée par cluster-misc.
        ingressClass:
          enabled: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
            publishedService:
              enabled: true
          kubernetesGateway:
            enabled: false
          kubernetesIngressNGINX:
            enabled: false
          file:
            enabled: true
            watch: true
            content:
              http:
                routers:
                  rustfs-console-home:
                    rule: 'Host(`s3.gastbob40.com`) && Path(`/`) && Method(`GET`) && HeaderRegexp(`Accept`, `text/html`)'
                    entryPoints: [websecure]
                    priority: 1000
                    middlewares: [rustfs-console]
                    service: noop@internal
                    tls: {}
                middlewares:
                  rustfs-console:
                    redirectRegex:
                      regex: '^https://s3\.gastbob40\.com/?$'
                      replacement: https://s3.gastbob40.com/rustfs/console/
                      permanent: true
                  public-hsts:
                    headers:
                      stsSeconds: 31536000
                      stsIncludeSubdomains: true
                      stsPreload: false
                      forceSTSHeader: false
                  # L'ordre sur les routes protégées doit être oauth-errors, oauth-auth.
                  oauth-errors:
                    errors:
                      status:
                        - "401"
                      statusRewrites:
                        "401": 302
                      service: oauth-proxy@file
                      query: "/oauth2/start?rd={url}"
                  oauth-auth:
                    forwardAuth:
                      address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
                      trustForwardHeader: true
                      authResponseHeaders:
                        - X-Auth-Request-User
                        - X-Auth-Request-Email
                      maxResponseBodySize: 1048576
                services:
                  oauth-proxy:
                    loadBalancer:
                      servers:
                        - url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180
                serversTransports:
                  vault-tls:
                    serverName: vault.k8s.gastbob40.com
                  argocd-tls:
                    serverName: argocd.k8s.gastbob40.com

        # Depuis le chart 40, le type du Service se configure sous spec.
        service:
          spec:
            type: LoadBalancer
        # Le défaut Traefik (60 s pour lire tout le corps) écourterait les gros uploads.
        # 3600 s est un plafond total, distinct des timeouts d'inactivité des backends.
        ports:
          web:
            http:
              # Supprimer les alias d’en-têtes ambigus avec underscore ou point.
              aliasHeadersStrategy: delete
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  # Les routes HTTP-01 de cert-manager restent prioritaires.
                  priority: 1
            transport:
              respondingTimeouts:
                readTimeout: 3600s
                writeTimeout: 0s
          websecure:
            http:
              aliasHeadersStrategy: delete
              tls:
                enabled: true
              # Activer HSTS uniquement sur HTTPS.
              middlewares:
                - public-hsts@file
            transport:
              respondingTimeouts:
                readTimeout: 3600s
                writeTimeout: 0s
        api:
          dashboard: false
        ingressRoute:
          dashboard:
            enabled: false
        log:
          format: json
          level: INFO
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 2
