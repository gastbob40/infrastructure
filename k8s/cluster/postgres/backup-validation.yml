apiVersion: batch/v1
kind: Job
metadata:
  name: pg-backup-rustfs-check
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  template:
    spec:
      containers:
      - name: pg-backup
        image: gastbob40/postgres-backup:latest
        imagePullPolicy: Always
        env:
        - name: PG_USER
          value: postgres
        - name: PG_HOST
          value: infra-main-cluster.postgres.svc.cluster.local
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres.infra-main-cluster.credentials.postgresql.acid.zalan.do
              key: password
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: root-user
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: root-password
        - name: AWS_ENDPOINT_URL
          value: https://api.s3.gastbob40.com
        - name: AWS_REGION
          value: us-east-1
        - name: S3_BUCKET
          value: postgres-backups
      restartPolicy: Never
  backoffLimit: 0
  activeDeadlineSeconds: 900
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-glacier-rustfs-check
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  template:
    spec:
      containers:
      - name: pg-backup
        image: gastbob40/postgres-backup:latest
        command:
        - /usr/local/bin/glacier.sh
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID_PRIVATE
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: root-user
        - name: AWS_SECRET_ACCESS_KEY_PRIVATE
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: root-password
        - name: AWS_ENDPOINT_S3_PRIVATE
          value: https://api.s3.gastbob40.com
        - name: AWS_ACCESS_KEY_ID_GLACIER
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY_GLACIER
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION_GLACIER
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: AWS_REGION
        - name: AWS_BUCKET_GLACIER
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: AWS_BUCKET
      restartPolicy: Never
  backoffLimit: 0
  activeDeadlineSeconds: 900
